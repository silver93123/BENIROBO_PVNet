# =============================================================================
# Bin Picking Vision 설정 (collect_dataset.py / src.camera 공용) - Femto Bolt
# =============================================================================
# 모든 길이 단위: mm
# Helios2용 configs/camera_config.yaml과 스키마가 다르니 섞어쓰지 않도록 주의.
# intensity는 IR 스트림(깊이 센서와 픽셀 정렬됨), XYZ는 PointCloudFilter로 변환.

camera:
  # 카메라 타입.
  type: femto_bolt

  # 시리얼 번호. null이면 첫 번째로 발견되는 카메라를 사용한다.
  serial:

  # ---- Femto Bolt 전용 옵션 ----
  # depth/IR 스트림 해상도 (반드시 서로 같아야 픽셀 정렬 유지됨).
  #   640x576 (NFOV Unbinned — 약 0.5~3.86 m)
  #   512x512 (WFOV Binned   — 약 0.25~2.5 m, 근거리 유리)
  depth_width: 640
  depth_height: 576
  fps: 15

  # 카메라 캡처 타임아웃 (ms), 워밍업 프레임 수 (초기 프레임 불안정 대비)
  capture_timeout_ms: 2000
  warmup_frames: 5

  # true로 하면 depth 격자에 정렬된 RGB도 추가로 캡처한다 (실험적 옵션).
  # IR/depth 기반 기본 파이프라인과는 분리되어 있어, 이 옵션이 실패해도
  # IR/depth 캡처 자체는 영향받지 않는다. "0. 데이터 수집" 탭에서
  # "RGB PNG (Femto Bolt 전용)" 체크박스도 같이 켜야 실제로 저장된다.
  capture_rgb: true

  valid_z_range_mm: [100.0, 1500.0]

  # ---------------------------------------------------------------------
  # 디바이스 프로퍼티 (선택). 여기 값을 바꾸면 open() 시 자동 적용됩니다 -
  # 코드를 다시 건드릴 필요 없습니다.
  #
  # femto_bolt.py 상단 주석의 "자동 노출만 지원"은 이 실기(S/N 확인 완료)에서
  # femto_bolt_property_util.py로 실측한 결과와 다릅니다 - 실제로는 컬러/뎁스/IR
  # 노출값까지 수동 조정이 가능했습니다. 아래는 그 실측([지원 O]) 결과만 담았고,
  # 미지원 프로퍼티는 넣어도 경고 로그만 남기고 무시되므로(카메라 연결 자체는
  # 안전) 다른 프로퍼티를 추가로 시도해봐도 괜찮습니다.
  #
  # 프로퍼티 이름 = pyorbbecsdk의 OBPropertyID 멤버명과 동일해야 합니다.
  # 접미사로 값 타입을 판별합니다: _BOOL -> true/false, _INT -> 정수,
  # _FLOAT -> 실수.
  # ---------------------------------------------------------------------
  device_properties:
    color:
      OB_PROP_COLOR_AUTO_EXPOSURE_BOOL: true
      # 수동 노출을 쓰려면 위를 false로 바꾸고 아래 EXPOSURE/GAIN을 원하는 값으로.
      OB_PROP_COLOR_EXPOSURE_INT: 200
      OB_PROP_COLOR_GAIN_INT: 0
      OB_PROP_COLOR_AUTO_WHITE_BALANCE_BOOL: true
      OB_PROP_COLOR_WHITE_BALANCE_INT: 6500
      OB_PROP_COLOR_BRIGHTNESS_INT: 10
      OB_PROP_COLOR_CONTRAST_INT: 50
      OB_PROP_COLOR_SATURATION_INT: 64
      OB_PROP_COLOR_SHARPNESS_INT: 24
      OB_PROP_COLOR_POWER_LINE_FREQUENCY_INT: 2   # 0:off 1:50Hz 2:60Hz
      OB_PROP_COLOR_MIRROR_BOOL: false
      OB_PROP_COLOR_FLIP_BOOL: false
      OB_PROP_COLOR_ROTATE_INT: 0                 # 0/90/180/270
      OB_PROP_COLOR_HDR_BOOL: false

    depth:
      OB_PROP_DEPTH_EXPOSURE_INT: 125
      OB_PROP_DEPTH_MIRROR_BOOL: false
      OB_PROP_DEPTH_FLIP_BOOL: false
      OB_PROP_DEPTH_ROTATE_INT: 0
      OB_PROP_DEPTH_SOFT_FILTER_BOOL: false
      OB_PROP_DEPTH_NOISE_REMOVAL_FILTER_BOOL: false
      OB_PROP_DEPTH_NOISE_REMOVAL_FILTER_MAX_DIFF_INT: 10
      OB_PROP_DEPTH_NOISE_REMOVAL_FILTER_MAX_SPECKLE_SIZE_INT: 50

    ir:
      OB_PROP_IR_EXPOSURE_INT: 125
      OB_PROP_IR_MIRROR_BOOL: false
      OB_PROP_IR_FLIP_BOOL: false
      OB_PROP_IR_ROTATE_INT: 0

    device:
      OB_PROP_INDICATOR_LIGHT_BOOL: true